task: mod
seed: 0
device: cuda
model:
  type: recurrent_workspace
  d_model: 144
  n_heads: 4
  d_ff: 576
  context_layers: 2
  workspace_size: 8
  num_output_slots: 4
  num_loops: 8
  workspace_init_mode: shuffled_context
data:
  train: data/generated/mod_fixed_n_1349/train.jsonl
  val: data/generated/mod_fixed_n_1349/val_iid.jsonl
optim:
  lr: 3.0e-4
  weight_decay: 0.01
  warmup_frac: 0.05
  total_steps: 50000
  batch_size: 512
  grad_clip: 1.0
log_every: 200
eval_every: 1000
eval_train_subset_size: 2000
early_stop_patience: 10
out_dir: runs/task_b_fixed_n_recurrent_k8_shuffled_context/seed0
